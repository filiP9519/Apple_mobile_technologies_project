name: Build Unsigned IPA

on:
  workflow_dispatch: # Lets you trigger the build manually via a button

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project CalendarReplica.xcodeproj \
            -scheme CalendarReplica \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CalendarReplica.app Payload/
          zip -r CalendarReplica.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalendarReplica-ipa
          path: CalendarReplica.ipa
