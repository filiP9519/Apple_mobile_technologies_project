name: CalendarReplica
options:
  bundleIdPrefix: com.filip.calendarreplica
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""

targets:
  CalendarReplica:
    type: application
    platform: iOS
    sources:
      - path: CalendarReplica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filip.calendarreplica.app
        INFOPLIST_KEY_CFBundleDisplayName: CalendarReplica
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CalendarReplicaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CalendarReplicaTests
    dependencies:
      - target: CalendarReplica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filip.calendarreplica.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CalendarReplica.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CalendarReplica"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CalendarReplicaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CalendarReplicaUITests
    dependencies:
      - target: CalendarReplica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filip.calendarreplica.uitests
        TEST_TARGET_NAME: CalendarReplica

schemes:
  CalendarReplica:
    build:
      targets:
        CalendarReplica: all
        CalendarReplicaTests: [test]
        CalendarReplicaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: CalendarReplicaTests
          parallelizable: false
        - name: CalendarReplicaUITests
          parallelizable: false
